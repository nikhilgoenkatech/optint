  <!-- Gauge arc inner -->
  <path d="M 47 58 A 21 21 0 0 1 89 58" fill="none" stroke="#1496ff" stroke-width="2" opacity="0.25"/>
  <!-- Tick marks -->
  <line x1="40" y1="58" x2="43.5" y2="55" stroke="#1496ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="30" x2="68" y2="34" stroke="#1496ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="96" y1="58" x2="92.5" y2="55" stroke="#1496ff" stroke-width="2" stroke-linecap="round"/>
  <!-- Needle pointing to ~70% (upper-right zone) -->
  <line x1="68" y1="58" x2="83" y2="37" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Needle pivot -->
  <circle cx="68" cy="58" r="4" fill="#1496ff"/>
  <circle cx="68" cy="58" r="2" fill="#ffffff"/>
  <!-- Signal dot on arc -->
  <circle cx="87" cy="43" r="3.5" fill="#1496ff"/>
  <!-- Wordmark -->
  <text x="112" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="24" fill="#1a1a2e">Calibrate</text>
  <text x="114" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="400" font-size="10" fill="#888" letter-spacing="2">OPERATIONAL INTELLIGENCE</text>
</svg>
